<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent"><canvas id="c"></canvas>
<script type="module">
// Renderiza UMA peça da cerca (v0.93.96) do modelo do Blockbench na câmera do jogo (oblíqua, K = 1, norte = -z para cima).
// Parâmetros: piece = horizontal | vertical | post | armn | arms ; wood = carvalho | betula | cerejeira. Veja scripts/extract-fence-model.py.
import * as THREE from './three.module.js';
const P = new URLSearchParams(location.search);
const piece = P.get('piece'), WOOD = P.get('wood');
const CELL = 12, PPU = 128 / CELL, K = 1;
const GATE = piece === 'gate', ANGLE = +(P.get('angle') || 0) * Math.PI / 180;
const [W, H, AY] = GATE ? [224, 300, 278] : [128, 232, 208];
const d = await (await fetch(GATE ? 'gate.json' : 'model.json')).json();
const byName = Object.fromEntries(d.elements.map((e) => [e.name, e]));
const loader = new THREE.TextureLoader();
const tile = (n) => new Promise((r) => loader.load(n, (x) => {
  x.colorSpace = THREE.SRGBColorSpace; x.magFilter = x.minFilter = THREE.NearestFilter; x.generateMipmaps = false;
  x.wrapS = x.wrapT = THREE.RepeatWrapping; r(x);
}));
const [woodTop, woodFront] = await Promise.all([tile('top-' + WOOD + '.png'), tile('front-' + WOOD + '.png')]);
const scene = new THREE.Scene();

// (a sombra de contato no chão não é cozida na arte: os sprites sólidos usam alphaTest e ela viraria pontos pretos; ver `fenceShadow` em render/fence.ts)

/** Malha do modelo com os vértices transformados por `map([x,y,z]) → [x,y,z]`; UV por projeção a partir da posição final (1 tile = 1 célula = 12 u). */
/** `tone` escurece (< 1) ou clareia (> 1) a peça: as travessas saem mais escuras que as estacas para se distinguirem delas. */
function add(e, map, upright, tone = 1) {
  for (const kind of ['top', 'side']) {
    const pos = [], uv = [], col = [];
    for (const f of Object.values(e.faces)) {
      const V = f.vertices.map((i) => map(e.vertices[i]));
      if (V.length < 3) continue;
      const [a, b, c] = V;
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
      const top = Math.abs(ny) > 0.6;
      if ((kind === 'top') !== top) continue;
      const shade = (top ? 1.0 : Math.abs(nz) > Math.abs(nx) ? 0.9 : 0.74) * tone;
      for (let i = 1; i < V.length - 1; i++) for (const v of [V[0], V[i], V[i + 1]]) {
        pos.push(v[0], v[1] - v[2] * K, v[2] * 0.02); col.push(shade, shade, shade);
        let h, vv;
        if (top) { h = v[0]; vv = -v[2]; } else if (Math.abs(nz) > Math.abs(nx)) { h = v[0]; vv = v[1]; } else { h = v[2]; vv = v[1]; }
        let u = h / CELL, w = vv / CELL;
        if (upright && !top) [u, w] = [w, -u];
        uv.push(u, w);
      }
    }
    if (!pos.length) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: kind === 'top' ? woodTop : woodFront, vertexColors: true, side: THREE.DoubleSide })));
  }
}
if (GATE) buildGate(); else buildFence();
function buildFence() {
const stake = byName['Frente 3'];                       // estaca de 4 × 17 u centrada em (0, 0)
const railH = [byName['Frontal 2 | nível 5'], byName['Frontal 2 | nível 12']];   // x de -10 a -2
const railV = [byName['Retorno 1 | nível 5'], byName['Retorno 1 | nível 12']];   // z de -10 a -2, em x = 24
const remap = (v, from0, from1, to0, to1) => to0 + ((v - from0) * (to1 - to0)) / (from1 - from0);
const RAIL_TONE = 0.68;
const wantStake = piece !== 'armn' && piece !== 'arms';
if (wantStake) add(stake, (v) => v, true);
if (piece === 'horizontal') for (const r of railH) {
  add(r, (v) => [remap(v[0], -10, -2, -6, 0), v[1], v[2]], false, RAIL_TONE);   // braço oeste
  add(r, (v) => [remap(v[0], -10, -2, 0, 6), v[1], v[2]], false, RAIL_TONE);    // braço leste
}
if (piece === 'vertical' || piece === 'armn') for (const r of railV) add(r, (v) => [v[0] - 24, v[1], remap(v[2], -10, -2, -6, 0)], false, RAIL_TONE);
if (piece === 'vertical' || piece === 'arms') for (const r of railV) add(r, (v) => [v[0] - 24, v[1], remap(v[2], -10, -2, 0, 6)], false, RAIL_TONE);
}

/** Portão: estacas e dobradiças fixas; a folha gira em torno do eixo vertical da dobradiça (x = -5,1) para o norte (-z) em `angle` graus. */
function buildGate() {
  const X0 = -5.1, c = Math.cos(ANGLE), sn = Math.sin(ANGLE);
  const swing = (v) => [X0 + (v[0] - X0) * c, v[1], v[2] - (v[0] - X0) * sn];
  for (const e of d.elements) {
    const n = e.name;
    if (n.startsWith('Frente estaca')) add(e, (v) => v, true, 1);
    else if (n.startsWith('Dobradi') ) add(e, (v) => v, false, 0.3);
    else if (n.startsWith('Fecho')) add(e, swing, false, 0.3);
    else if (n.startsWith('Cora')) add(e, swing, false, 0.55);
    else if (n.startsWith('Frente tábua')) add(e, swing, true, 0.85);
    else if (n.startsWith('Frente montante')) add(e, swing, true, 0.68);
    else if (n.startsWith('Travessa')) add(e, swing, false, 0.68);
  }
}

const cv = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false); r.setClearColor(0x000000, 0);
const top = AY / PPU, bottom = -(H - AY) / PPU;
const cam = new THREE.OrthographicCamera(-W / 2 / PPU, W / 2 / PPU, top, bottom, -100, 100);
cam.position.z = 10;
r.render(scene, cam);
window.done = true;
</script>
